services:
  postgres:
    image: postgres:16-alpine
    container_name: cpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cpa-femass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:  ${QUARKUS_DATASOURCE_PASSWORD_VARIABLE:-Cp2af0em2as6s}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpa-femass"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: cpa-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CPA_ADMIN_PASSWORD: ${KEYCLOAK_CPA_ADMIN_PASSWORD:-cpa-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/9000'"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/cpa-femass
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD_VARIABLE:-Cp2af0em2as6s}
      QUARKUS_HTTP_CORS_ORIGINS:   ${QUARKUS_HTTP_CORS_ORIGINS_VARIABLE:-http://localhost:5173}
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/cpa
      KEYCLOAK_CLIENT_ID: cpa-backend
    ports:
      - "8080:8080"

volumes:
  postgres_data:

